<section class="ministry-block" id="ministry">
  <div class="contacts-inner">
    <p class="section-kicker" data-i18n="ministry.kicker">Життя церкви</p>
    <h2 class="ministry-title" data-i18n="ministry.title">Служіння</h2>
  </div>
  <div class="swiper ministry-slider" aria-label="Напрями служіння" data-i18n-aria-label="ministry.ariaLabel">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <div class="card">
          <img src="/assets/contacts/small-group-service.jpg" alt="Малі групи" data-i18n-alt="ministry.smallGroups" loading="lazy" decoding="async" />
          <div class="card-overlay"><h3 data-i18n="ministry.smallGroups">Малі групи</h3></div>
        </div>
      </div>
      <div class="swiper-slide">
        <div class="card">
          <img src="/assets/contacts/weekly-seervice.jpg" alt="Недільні служіння" data-i18n-alt="ministry.services" loading="lazy" decoding="async" />
          <div class="card-overlay"><h3 data-i18n="ministry.services">Недільні служіння</h3></div>
        </div>
      </div>
      <div class="swiper-slide">
        <div class="card">
          <img src="/assets/contacts/youth-service.jpg" alt="Молодіжні заходи" data-i18n-alt="ministry.youth" loading="lazy" decoding="async" />
          <div class="card-overlay"><h3 data-i18n="ministry.youth">Молодіжні заходи</h3></div>
        </div>
      </div>
      <div class="swiper-slide">
        <div class="card">
          <img src="/assets/contacts/media-service.jpg" alt="Музичне служіння" data-i18n-alt="ministry.music" loading="lazy" decoding="async" />
          <div class="card-overlay"><h3 data-i18n="ministry.music">Музичне служіння</h3></div>
        </div>
      </div>
    </div>
    <div class="ministry-pagination" aria-hidden="true"></div>
  </div>
</section>

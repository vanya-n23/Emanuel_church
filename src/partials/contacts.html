<section class="contacts-section">
  <div class="contact-band" id="contacts">
    <div class="contacts-wrapper">
      <div class="contact-info">
        <p class="section-kicker" data-i18n="contacts.kicker">Завітайте до нас</p>
        <h2 class="contacts-title" data-i18n="contacts.title">Наші контакти</h2>
        <address class="contacts">
          <ul class="contacts-list">
            <li class="contacts-item"><a href="mailto:info@emmanuel-church.sk">info@emmanuel-church.sk</a></li>
            <li class="contacts-item" data-i18n="contacts.schedule">Щонеділі о 10:00</li>
          </ul>
        </address>
        <div class="location-text">
          <strong data-i18n="contacts.location">Наша локація</strong>
          <span>Ferienčíkova 5, Bratislava, Slovakia</span>
        </div>
      </div>

      <div class="map-block">
        <iframe
          class="map-frame"
          title="Google Maps: Ferienčíkova 5, Bratislava, Slovakia"
          data-i18n-aria-label="contacts.mapAlt"
          src="https://www.google.com/maps?q=Ferien%C4%8D%C3%ADkova%205%2C%20Bratislava%2C%20Slovakia&amp;output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>
  </div>
</section>
